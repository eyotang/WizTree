name: Rust checks
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libasound2-dev libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev libvulkan-dev libssl-dev libdbus-1-dev xvfb libgl1-mesa-dri dbus-x11
      - run: cargo fmt --all -- --check
      - run: rustfmt --check --edition 2024 crates/desktop/src/app_actions.rs crates/desktop/src/app_view.rs crates/desktop/src/interaction_actions.rs crates/desktop/src/inspector.rs crates/desktop/src/interaction_smoke.rs crates/desktop/src/dialog_smoke.rs crates/desktop/src/scan_reset_smoke.rs crates/desktop/src/appearance_smoke.rs
      - name: Native scanner regression tests
        run: cargo test --locked -p disk-core
      - run: cargo test --locked -p wiztree-desktop
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo build --locked -p wiztree-desktop
      - name: Build native UI acceptance executable
        run: cargo build --locked -p wiztree-desktop --features interaction-smoke
      - name: Native UI interaction and scan lifecycle
        timeout-minutes: 3
        shell: python
        run: |
          import os
          import subprocess
          import sys
          suffix = '.exe' if sys.platform == 'win32' else ''
          command = [sys.executable, 'tools/verify_desktop.py', '--binary', 'target/debug/wiztree-rust' + suffix, '--report', 'target/desktop-validation.json']
          env = os.environ.copy()
          if sys.platform == 'linux':
              env.pop('WAYLAND_DISPLAY', None)
              env['LIBGL_ALWAYS_SOFTWARE'] = '1'
              command = ['dbus-run-session', '--', 'xvfb-run', '-a', '-s', '-screen 0 1600x1000x24'] + command
          subprocess.run(command, env=env, check=True)
