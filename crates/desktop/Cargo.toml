[package]
name = "wiztree-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gpui-kit = "=0.7.3"
disk-core = { path = "../disk-core" }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
trash = "5"
png = "0.18"

[[bin]]
name = "wiztree-rust"
path = "src/main.rs"

[features]
dialog-smoke = []
interaction-smoke = []
