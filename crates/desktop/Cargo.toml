[package]
name = "wiztree-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gpui-kit = "=0.7.3"
# Enable the scene readback API only in the visual verification executable.
gpui-visual = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false, features = ["test-support"], optional = true }
disk-core = { path = "../disk-core" }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
trash = "5"
png = "0.18"

[[bin]]
name = "wiztree-rust"
path = "src/main.rs"

[features]
dialog-smoke = []
interaction-smoke = []

appearance-smoke = ["dep:gpui-visual"]
